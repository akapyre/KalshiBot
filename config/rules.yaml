# KalshiBot rule set
#
# ODDS CONVENTION: all odds in this file are American moneyline odds for the
# PREGAME-FAVORED team (the team that opened as favorite). Negative = favorite,
# positive = underdog; the further from zero, the stronger the lean.
#
# ASSUMPTIONS I made translating your plain-English rules into exact numeric
# comparisons -- READ THESE before going live, they control real money:
#
#   1. "-200 or higher to start" = pregame odds <= -200 (i.e. -200, -250,
#      -300... "higher" read as magnitude, not numeric value).
#   2. "-150 to start" is treated as its own band: pregame odds in
#      [-199, -150], so it doesn't overlap the -200-or-steeper rule above it.
#      Your original wording only said "-150", not a band -- if you meant an
#      exact -150 only (no wider range), tell me and I'll tighten it.
#   3. "odds drop / move between +100-+200" and "move past +115" both mean
#      the live line for the pregame favorite has drifted from its pregame
#      price up into that positive (underdog) range.
#   4. "do not wager if the team falls below +200" (soccer rule 2) -- I
#      interpreted this the same as rule 1's ceiling: don't place if the
#      line has moved BEYOND +200 (i.e. more than +200), not literally
#      "less than +200". This is the most ambiguous line in your rule set --
#      confirm this reads right against the dry-run logs before going live.
#   5. "-115 odds or below" (NFL) = live odds >= -115 (i.e. the favorite has
#      faded from -250 up toward -115 or further, including into positive
#      territory) -- "below" read as "the favorite is less heavily favored",
#      not as a smaller signed number.
#   6. Tennis (favorite threshold changed from -300 to -200, 2026-10-11)
#      "moves below +100" = the favorite has faded to roughly a
#      coin flip: live odds between -110 and +100 inclusive (your call,
#      2026-10-07). Not a bet while it's still clearly favored (e.g. -200),
#      and not once it's become a real underdog (e.g. +120).
#   7. MLB "falls below +100 but not past +200" -- this is the most confusing
#      wording in the whole set, since "below +100" and "not past +200" would
#      be redundant if read literally (anything under +100 is automatically
#      under +200 too). I read this as the SAME shape as soccer_heavy_favorite:
#      a band from +100 to +200 inclusive, on the theory that "falls below"
#      describes the team's fortunes getting worse (colloquial), not the
#      number decreasing. If you actually meant "live odds < 100, but
#      invalidate if it ever went past +200 first," tell me and I'll switch
#      it -- this is a genuine coin-flip read, not a confident one.
#   8. NFL "-150 or higher to start" (nfl_moderate_favorite) is open-ended
#      (-150 or steeper, no ceiling) per your explicit call -- this DELIBERATELY
#      overlaps nfl_favorite_fade's -250-or-steeper range. A steep favorite
#      (-250 or worse) can trigger nfl_favorite_fade, nfl_moderate_favorite,
#      AND (in the 4th quarter) nfl_fourth_quarter_reentry all on the same
#      game -- up to three separate $25 wagers -- confirmed intentional, not
#      a bug. "during that period" (for the +100/+150 trigger) has no
#      quarter/time gate in this rule -- read as "once, whenever live odds
#      land in that band," not a specific game window. Tell me if you meant
#      something more specific by "that period."
#   9. NHL (nhl_favorite_trails_by_one) is score-based, not odds-based:
#      wager on a -170-or-steeper pregame favorite when the score is exactly
#      0-1 or 1-2 (favorite's goals first), at whatever the live price is.
#      a) The bot polls, so it can't see goal ORDER -- it sees a 1-2 score
#         and bets, even if the underdog scored first (0-1, 1-1, 1-2). In
#         practice that case only slips through if the 0-1 moment was
#         missed between polls, since a bet placed at 0-1 uses up the one
#         bet for that game anyway.
#      b) "Go-ahead goal in the last 6 minutes" is approximated as "the bot
#         first sees that score with 6:00 or less left in the 3rd, or in
#         overtime." A goal at 6:30 that the next poll only catches at 5:50
#         gets skipped -- the cautious direction. Shorter --interval makes
#         this more precise but costs more API usage.
#      c) If the game clock can't be read in the 3rd period, that period is
#         treated as "too late" rather than guessed at.
#
# STAKE / RISK: flat $25 per wager (config/risk.yaml). No daily loss cap and
# no max concurrent positions are enforced right now, per your instruction --
# both are wired up as config knobs so you can turn them on later without
# code changes.
#
#  10. Soccer first half (soccer_first_half_favorite), added 2026-10-11:
#      favorite at -300 or steeper on the full-match line; while the first
#      half is under way and it's 0-0, bet the favorite to win the FIRST
#      HALF on Kalshi when its first-half odds are -130 to +120 ("-130 or
#      greater, don't bet past +120"). Allowed alongside
#      soccer_heavy_favorite on the same match (your call): up to two $25
#      bets on a -300 favorite.
#
#  11. Backtest changes (2026-10-12, Kalshi price history, ~400 days):
#      NFL moderate favorite and 4th-quarter re-bet PAUSED (lost 28% / 21%);
#      NFL fade only bets -115..-100. CFB moderate favorite PAUSED (no edge);
#      CFB fade capped at +150 (bets past +150 lost almost every time).
#      Paused rules have `enabled: false` -- flip it to true to resume.
#
#  12. Rule sweep (2026-10-13): NFL fade and the original college fade /
#      4th-quarter rules and tennis rule PAUSED; added cfb_big_favorite_near_even,
#      cfb_late_favorite_slide and tennis_huge_favorite_trial. These new rules
#      trigger on Kalshi's YES ask (kalshi_cents), not sportsbook odds.
#
#  13. NHL player props (nhl_prop_lower_line), added 2026-10-15: see the
#      rule's description. Kalshi's NHL prop markets were not yet checked
#      against live data -- `python -m kalshibot.diagnose props` shows what
#      the bot finds.
#
# MULTI-BET: each rule bets at most once per game. Rules that may stack on
# the same game: the three NFL rules (and CFB's), and soccer's first-half
# rule with soccer_heavy_favorite.

stake_usd: 25

rules:
  - id: soccer_heavy_favorite
    summary: "Favorite opened at -200 or stronger. Bet it when its live odds drift to +100 to +200; not past +200."   # plain-English version for the results page
    sport: soccer
    description: >
      Pregame favorite at -200 or steeper. Wager on that team when its live
      price drifts to between +100 and +200. Skip if it drifts past +200.
    pregame:
      side: favorite
      max_odds: -200          # pregame odds <= -200
    trigger:
      min_odds: 100
      max_odds: 200            # inclusive upper bound
    invalidate_if:
      odds_beyond: 200         # do not place once live odds have exceeded +200
    max_bets_per_game: 2       # so soccer_first_half_favorite on the same match doesn't block it

  - id: soccer_moderate_favorite
    summary: "Favorite opened between -150 and -199. Bet it when its live odds move past +115; not if it's down a goal after halftime, or past +200."   # plain-English version for the results page
    sport: soccer
    description: >
      Pregame favorite at -150 (band: -150 to -199). Wager when live price
      moves past +115. Skip if trailing by a goal past halftime, or if the
      line has moved beyond +200.
    pregame:
      side: favorite
      min_odds: -199
      max_odds: -150
    trigger:
      min_odds: 115            # exclusive: "past +115"
      exclusive_min: true
    invalidate_if:
      odds_beyond: 200
      trailing_by_goal_after_halftime: true
    max_bets_per_game: 1

  - id: soccer_first_half_favorite
    summary: "Favorite opened at -300 or stronger. While it's 0-0 in the first half, bet it to win the first half when its first-half odds are -130 to +120."   # plain-English version for the results page
    sport: soccer
    market: first_half         # first-half odds, and a bet on the first-half result
    description: >
      Pregame (full-match) favorite at -300 or steeper. While it's still
      0-0 in the first half, bet the favorite to win the FIRST HALF once
      its first-half odds have drifted to -130 or looser -- but not past
      +120.
    pregame:
      side: favorite
      max_odds: -300
    trigger:
      min_odds: -130             # -130 or looser...
      max_odds: 120              # ...up to +120, never past it
      quarter: 1                 # first half only (not at halftime)
      scores: [[0, 0]]           # still 0-0
    invalidate_if: {}
    max_bets_per_game: 2       # can bet alongside soccer_heavy_favorite on the same match

  - id: tennis_heavy_favorite
    enabled: false             # paused 2026-10-13 after the rule sweep -- set to true to turn back on
    summary: "Favorite opened at -200 or stronger. Bet it when its live odds fade to near even: -110 to +100."   # plain-English version for the results page
    sport: tennis
    description: >
      Pregame favorite at -200 or steeper. Wager when the favorite's live
      price has faded to near even: -110 through +100.
    pregame:
      side: favorite
      max_odds: -200
    trigger:
      min_odds: -110            # no shorter than -110...
      max_odds: 100             # ...and no longer than +100
    invalidate_if: {}
    max_bets_per_game: 1

  - id: nfl_favorite_fade
    enabled: false             # paused 2026-10-13 after the rule sweep -- set to true to turn back on
    summary: "Favorite opened at -250 or stronger. Bet it when its live odds fade to -115 through -100 (still a slight favorite)."   # plain-English version for the results page
    sport: nfl
    description: >
      Pregame favorite at -250 or steeper. First wager when live price has
      faded to -115 or looser (i.e. -115 through positive territory).
    pregame:
      side: favorite
      max_odds: -250
    trigger:
      min_odds: -115            # odds >= -115
      max_odds: -100            # backtest 2026-10-12: buying past even lost; only -115..-100
    invalidate_if: {}
    max_bets_per_game: 3       # so it never blocks nfl_moderate_favorite or nfl_fourth_quarter_reentry

  - id: nfl_fourth_quarter_reentry
    enabled: false             # paused 2026-10-12 after the backtest -- set to true to turn back on
    summary: "After a favorite-fade bet on the same game: bet again in the 4th quarter if the favorite is +110 to +165."   # plain-English version for the results page
    sport: nfl
    description: >
      Extra wager on the same game as nfl_favorite_fade, only in the 4th
      quarter, only if live price is between +110 and +165.
    requires_prior_rule: nfl_favorite_fade
    pregame:
      side: favorite
      max_odds: -250
    trigger:
      min_odds: 110
      max_odds: 165
      quarter: 4
    invalidate_if: {}
    max_bets_per_game: 3       # so it never blocks the other two NFL rules

  - id: nfl_moderate_favorite
    enabled: false             # paused 2026-10-12 after the backtest -- set to true to turn back on
    summary: "Favorite opened at -150 or stronger. Bet it once when its live odds are +100 to +150."   # plain-English version for the results page
    sport: nfl
    description: >
      Pregame favorite at -150 or steeper -- open-ended, deliberately
      overlapping nfl_favorite_fade's -250-or-steeper range per your call.
      Wager once when live price is between +100 and +150. On a favorite
      that's -250 or steeper, this can fire ALONGSIDE nfl_favorite_fade
      (and, later in the game, nfl_fourth_quarter_reentry too) for the same
      game -- up to 3 separate $25 wagers on one NFL game in the specific
      case where a steep favorite hits all three conditions. Confirmed
      intentional -- all three NFL rules' max_bets_per_game is 3 so none of
      them block each other, whatever order they fire in.
    pregame:
      side: favorite
      max_odds: -150
    trigger:
      min_odds: 100
      max_odds: 150
    invalidate_if: {}
    max_bets_per_game: 3

  - id: cfb_favorite_fade
    enabled: false             # paused 2026-10-13 after the rule sweep -- set to true to turn back on
    summary: "Favorite opened at -250 or stronger. Bet it when its live odds fade to -115 through +150."   # plain-English version for the results page
    sport: cfb
    description: >
      Same rule as nfl_favorite_fade, applied to college football. Pregame
      favorite at -250 or steeper. Wager when live price has faded to -115
      or looser.
    pregame:
      side: favorite
      max_odds: -250
    trigger:
      min_odds: -115
      max_odds: 150              # backtest 2026-10-12: bets past +150 lost almost every time
    invalidate_if: {}
    max_bets_per_game: 3       # mirrors the NFL rules' stacking -- see nfl_moderate_favorite

  - id: cfb_fourth_quarter_reentry
    enabled: false             # paused 2026-10-13 after the rule sweep -- set to true to turn back on
    summary: "After a favorite-fade bet on the same game: bet again in the 4th quarter if the favorite is +110 to +165."   # plain-English version for the results page
    sport: cfb
    description: >
      Same rule as nfl_fourth_quarter_reentry, applied to college football.
      Extra wager on the same game as cfb_favorite_fade, only in the 4th
      quarter, only if live price is between +110 and +165.
    requires_prior_rule: cfb_favorite_fade
    pregame:
      side: favorite
      max_odds: -250
    trigger:
      min_odds: 110
      max_odds: 165
      quarter: 4
    invalidate_if: {}
    max_bets_per_game: 3

  - id: cfb_moderate_favorite
    enabled: false             # paused 2026-10-12 after the backtest -- set to true to turn back on
    summary: "Favorite opened at -150 or stronger. Bet it once when its live odds are +100 to +150."   # plain-English version for the results page
    sport: cfb
    description: >
      Same rule as nfl_moderate_favorite, applied to college football.
      Pregame favorite at -150 or steeper (open-ended, deliberately
      overlapping cfb_favorite_fade). Wager once when live price is
      between +100 and +150.
    pregame:
      side: favorite
      max_odds: -150
    trigger:
      min_odds: 100
      max_odds: 150
    invalidate_if: {}
    max_bets_per_game: 3

  - id: cfb_big_favorite_near_even
    summary: "Favorite opened at -400 or stronger. Bet it when Kalshi's price falls to 45-59¢ (-144 to +122), any time."
    sport: cfb
    description: >
      From the rule sweep (2026-10-13): -400-or-stronger college favorites
      that slipped to roughly even money won ~68% vs ~54% priced, on both
      older and newer games. Triggers on Kalshi's own price.
    pregame:
      side: favorite
      max_odds: -400
    trigger:
      kalshi_cents: [45, 59]     # Kalshi YES ask, inclusive
    invalidate_if: {}
    max_bets_per_game: 2       # can stack with cfb_late_favorite_slide

  - id: cfb_late_favorite_slide
    summary: "Favorite opened at -200 or stronger. In the 4th quarter, bet it when Kalshi's price is 40-49¢ (+104 to +150)."
    sport: cfb
    description: >
      From the rule sweep (2026-10-13): -200-or-stronger college favorites
      priced 40-49c in the 4th quarter won ~56-63% vs ~44% priced.
      Triggers on Kalshi's own price.
    pregame:
      side: favorite
      max_odds: -200
    trigger:
      kalshi_cents: [40, 49]
      quarter: 4
    invalidate_if: {}
    max_bets_per_game: 2

  - id: tennis_huge_favorite_trial
    summary: "TRIAL. Favorite opened at -500 or stronger. Bet it when Kalshi's price falls to 40-59¢ (-144 to +150)."
    sport: tennis
    description: >
      Trial from the rule sweep (2026-10-13): -500-or-stronger favorites at
      40-59c returned ~+10% on newer matches, but the tennis sweep overall
      looked close to chance. Watch it on the results page.
    pregame:
      side: favorite
      max_odds: -500
    trigger:
      kalshi_cents: [40, 59]
    invalidate_if: {}
    max_bets_per_game: 1

  - id: nhl_favorite_trails_by_one
    summary: "Favorite opened at -170 or stronger. Bet it when the underdog leads 1-0 or 2-1, unless it's the last 6 minutes of the 3rd period or overtime."   # plain-English version for the results page
    sport: nhl
    description: >
      Pregame favorite at -170 or steeper. Wager on the favorite when the
      underdog leads by one at 1-0 or 2-1, unless it's the last 6 minutes of
      regulation (or overtime). See assumption #9 above.
    pregame:
      side: favorite
      max_odds: -170
    trigger:
      favorite_trailing_scores: [[0, 1], [1, 2]]   # [favorite goals, underdog goals]
    invalidate_if:
      late_in_game:
        period: 3
        minutes_remaining: 6
    max_bets_per_game: 1

  - id: nhl_prop_lower_line
    kind: player_prop   # player props -- run by kalshibot/props.py, not the game rules
    summary: "Player is -200 or stronger at puck drop to hit a points or shots-on-goal line (e.g. 3+ shots). Bet the next lower line (2+ shots) once Kalshi prices it at -140 or longer (30-58¢). Max 2 per game."
    description: >
      Added 2026-10-15. All prices are Kalshi's. "-200 to hit" = the highest
      line on the player's Kalshi ladder priced 67¢ (-200) or more at puck
      drop. The bet = YES on the line one below it, when its ask is 30-58¢
      (-140 to +233). A player whose -200 line is already the lowest one
      (usually "1+ points") has no lower line and is skipped. One bet per
      player per stat; at most 2 prop bets per game. The 30¢ floor and the
      per-game cap were not in your instructions -- they guard against an
      injured/benched player whose price collapses, and against many
      players all sliding at once late in a game. Change or remove them here.
    sport: nhl
    stats: [points, shots]
    pregame: {max_odds: -200}
    trigger: {kalshi_cents: [30, 58]}
    max_bets_per_game: 2

  - id: mlb_favorite_fade
    summary: "Favorite opened at -200 or stronger. From the 7th inning on, bet it when its live odds are +100 to +200."   # plain-English version for the results page
    sport: mlb
    description: >
      Pregame favorite at -200 or steeper. Wager when live price is between
      +100 and +200, but only once the game is past the 6th inning (7th
      inning or later). See assumption #7 above -- the trigger band here is
      my best-guess reading of ambiguous wording.
    pregame:
      side: favorite
      max_odds: -200
    trigger:
      min_odds: 100
      max_odds: 200
      period_min: 7             # "past the 6th inning" = 7th inning or later
    invalidate_if: {}
    max_bets_per_game: 1
